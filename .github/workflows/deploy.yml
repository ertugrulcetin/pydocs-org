# Tests, builds and deploys PyDocs (PLAN.md Phase 5). Runs on Linux on purpose:
# 29 symbol pages differ only in case (logging/DEBUG vs logging/debug), so the
# site must be built on a case-sensitive file system.
name: deploy

on:
  push:
    branches: [master]
  # Nightly re-bake of community content into the static pages (PLAN.md Phase 5).
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-extractor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extractor
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Cache docs archive
        uses: actions/cache@v6
        with:
          path: extractor/.cache
          key: docs-3.15.2-${{ hashFiles('extractor/pydocs_extract/config.py') }}
      - run: uv sync --locked
      - run: uv run pytest -q

  build-deploy:
    needs: test-extractor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run typecheck:worker
      - run: npm run typecheck:site
      - name: Snapshot community content (R2)
        if: env.HAS_CF_TOKEN == 'true'
        run: node scripts/snapshot.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Layout check (no sideways scroll, nothing sticking out of boxes)
        run: |
          npx playwright install --with-deps chromium
          npx astro preview --port 4321 > /tmp/preview.log 2>&1 &
          curl -s --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://localhost:4321/
          npm run check:layout
      - name: Check page and file counts
        run: |
          pages=$(find dist -name '*.html' | wc -l)
          files=$(find dist -type f | wc -l)
          echo "html pages: $pages, files: $files"
          # Workers static assets: 20,000 files per version on the free plan (PLAN.md §10).
          test "$files" -le 18000
          # 25 MiB per asset; split the export before it gets close (PLAN.md §10).
          export_bytes=$(stat -c %s dist/export.json)
          echo "export.json: $export_bytes bytes"
          test "$export_bytes" -le 20971520
      - name: Deploy
        if: env.HAS_CF_TOKEN == 'true' && github.ref == 'refs/heads/master'
        run: node scripts/assert-case-sensitive.mjs && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy skipped
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set; build checked but not deployed."
